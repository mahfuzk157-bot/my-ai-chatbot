<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAHFUZ AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #10121b;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 20px;
  text-align: center;
  background: #191d2b;
  border-bottom: 1px solid #303548;
}

header h1 {
  margin: 0;
  color: #8b9cff;
}

header p {
  margin: 7px 0 0;
  color: #aaa;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}

.message {
  padding: 13px 16px;
  margin: 12px 0;
  border-radius: 14px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #3546a0;
  margin-left: auto;
}

.bot {
  background: #252b3b;
  margin-right: auto;
}

#form {
  display: flex;
  gap: 8px;
  padding: 14px;
  background: #191d2b;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #444b60;
  border-radius: 10px;
  background: #10121b;
  color: white;
  font-size: 16px;
}

button {
  padding: 14px 18px;
  border: none;
  border-radius: 10px;
  background: #687cff;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>MAHFUZ AI</h1>
  <p>Your Personal AI Assistant</p>
</header>

<div id="chat">
  <div class="message bot">
    Hello! Welcome to MAHFUZ AI. How can I help you today?
  </div>
</div>

<form id="form">
  <input id="message" type="text"
    placeholder="Ask me anything..." autocomplete="off">
  <button id="send" type="submit">Send</button>
</form>

<script>
const form = document.getElementById("form");
const input = document.getElementById("message");
const chat = document.getElementById("chat");
const send = document.getElementById("send");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";
  send.disabled = true;

  const loading = addMessage("MAHFUZ AI is thinking...", "bot");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    loading.textContent = data.reply || "No reply received.";

  } catch (error) {
    loading.textContent = "Error: " + error.message;
  }

  send.disabled = false;
  input.focus();
});
</script>

</body>
</html>
